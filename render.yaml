services:
  - type: web
    name: wattwise-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: enables the Claude-powered Volt assistant and handwritten-bill
      # reading. Leave unset to run with the offline assistant + OCR only.
      - key: ANTHROPIC_API_KEY
        sync: false
